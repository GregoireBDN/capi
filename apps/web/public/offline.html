<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f4f7fc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#090c1a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Hors ligne · Capi</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!--
      Served by the service worker when a page cannot be reached. Static on
      purpose: no data, no external resources (only the precached logo).
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7fc;
        --fg: #2a1d12;
        --muted: #5f5a55;
        --primary: #2f63e1;
        --primary-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090c1a;
          --fg: #eef0f6;
          --muted: #a3a8b8;
          --primary: #00bce0;
          --primary-fg: #090c1a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1.5rem;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source
          srcset="/brand/capi-mark-clair.svg"
          media="(prefers-color-scheme: dark)"
        />
        <img src="/brand/capi-mark.svg" alt="" />
      </picture>
      <h1>Hors ligne</h1>
      <p>Reconnectez-vous pour voir vos finances.</p>
      <button type="button" id="retry">Réessayer</button>
    </main>
    <script>
      document
        .getElementById('retry')
        .addEventListener('click', () => location.reload())
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
