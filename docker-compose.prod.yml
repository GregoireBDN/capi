# Production stack (ADR 0001, runbook: docs/runbooks/production-stack.md).
#
# Deployed in /srv/finances with a root-only `.env` next to this file (template:
# .env.production.example). No service publishes a port: Caddy (infra repo)
# reaches `web` on the external `proxy` network as `finances-web:3000`, and
# `api`/`db` stay on this project's internal network. The remote MCP adapter
# (`finances-mcp`, ADR 0003, #328) only runs with the `remote-mcp` profile
# (COMPOSE_PROFILES=remote-mcp in .env); Caddy reaches it as finances-mcp:4100.
#
# Images come from GHCR, pinned by FINANCES_VERSION. To build them locally
# instead, add docker-compose.build.yml (see the runbook), and on a dev machine
# always pass `-p finances-local`: the dev stack (docker-compose.yml) is also
# named `finances`.
name: finances

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Container hardening for `api`, `web` and `finances-mcp` (#183): they run as the image's
# unprivileged `node` user on a read-only root filesystem (only a small /tmp
# is writable), with no Linux capabilities, no privilege escalation through
# setuid binaries, and bounded memory and process counts. `docker compose run`
# (migrations and seed in deploy/deploy.sh) applies the same settings.
x-hardening: &hardening
  user: node
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Node sizes its heap from the memory limit; the swap limit equal to it
  # keeps the container from swapping.
  mem_limit: ${APP_MEM_LIMIT:-512m}
  memswap_limit: ${APP_MEM_LIMIT:-512m}
  pids_limit: 256

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finances}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # The entrypoint starts as root to fix the data directory's ownership,
    # then drops to `postgres` (su-exec): only the capabilities it needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  api:
    image: ghcr.io/gregoirebdn/finances-api:${FINANCES_VERSION:?set FINANCES_VERSION in .env}
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finances}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      # Passkeys (WebAuthn): empty = APP_URL's host name and origin.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # Peers allowed to set the client IP (X-Forwarded-For): `web`, on this
      # project's network, which only `web` and `db` join (#49).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,uniquelocal}
      # SMTP is optional: without SMTP_HOST no email is sent and /api/health
      # does not check it.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@finances.app}
      PRICE_API_ENABLED: ${PRICE_API_ENABLED:-true}
      PRICE_API_URL: ${PRICE_API_URL:-https://api.coingecko.com/api/v3}
      PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-600}
      # Wallet sync (#129, ADR 0002): off unless set to "true".
      WALLET_SYNC_ENABLED: ${WALLET_SYNC_ENABLED:-false}
      ESPLORA_URL: ${ESPLORA_URL:-https://mempool.space/api}
      ESPLORA_MIN_INTERVAL_MS: ${ESPLORA_MIN_INTERVAL_MS:-1000}
      EVM_RPC_URLS: ${EVM_RPC_URLS:-}
      WALLET_SYNC_TIMEOUT_MS: ${WALLET_SYNC_TIMEOUT_MS:-10000}
      WALLET_SYNC_INTERVAL_SECONDS: ${WALLET_SYNC_INTERVAL_SECONDS:-600}
      # Remote MCP OAuth (#78, ADR 0003): off unless set to "true". Off, no
      # /api/oauth route is mounted and every OAuth token is refused: the kill
      # switch of every Claude connector (docs/runbooks/remote-mcp.md).
      REMOTE_MCP_ENABLED: ${REMOTE_MCP_ENABLED:-false}
      REMOTE_MCP_PUBLIC_URL: ${REMOTE_MCP_PUBLIC_URL:-}
      REMOTE_MCP_REDIRECT_URIS: ${REMOTE_MCP_REDIRECT_URIS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Hit the real Terminus endpoint, which checks the DB (and SMTP when it is
      # configured) — a 5xx makes `fetch` resolve with `ok: false` → exit 1.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  web:
    image: ghcr.io/gregoirebdn/finances-web:${FINANCES_VERSION:?set FINANCES_VERSION in .env}
    <<: *hardening
    environment:
      # The web server proxies /api/* to the API and calls it during SSR, so the
      # browser only talks to the web origin and the session cookies are
      # first-party (see docs/domain/auth-and-sessions.md).
      API_URL: http://api:4000
      # Peers allowed to set the client IP (X-Forwarded-For): Caddy only, by
      # its service name on the `proxy` network (infra repo, caddy/compose.yml),
      # resolved through Docker's DNS every 30 s (#49, #183). Other containers
      # on `proxy` can't choose their client IP. Fallback: uniquelocal.
      TRUSTED_PROXIES: ${WEB_TRUSTED_PROXIES:-caddy}
    networks:
      default: {}
      proxy:
        # Caddy's upstream: finances-web:3000.
        aliases:
          - finances-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The whole chain: web → /api proxy → api → db.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # Remote MCP adapter (#78, ADR 0003, #328): the only part of the app on a
  # public host (Caddy, infra repo: only its seven paths, from Anthropic's
  # range). It holds no secret and no database access; it checks OAuth tokens
  # with the API and calls it with them. Only started with the `remote-mcp`
  # profile, and refuses to start unless REMOTE_MCP_ENABLED=true.
  finances-mcp:
    image: ghcr.io/gregoirebdn/finances-mcp:${FINANCES_VERSION:?set FINANCES_VERSION in .env}
    profiles: [remote-mcp]
    <<: *hardening
    mem_limit: ${MCP_MEM_LIMIT:-256m}
    memswap_limit: ${MCP_MEM_LIMIT:-256m}
    pids_limit: 128
    environment:
      REMOTE_MCP_ENABLED: ${REMOTE_MCP_ENABLED:-false}
      # Public origin (https): the OAuth issuer; MCP at <origin>/mcp.
      REMOTE_MCP_PUBLIC_URL: ${REMOTE_MCP_PUBLIC_URL:-}
      FINANCES_API_URL: http://api:4000
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: '4100'
      # Peers allowed to set the client IP (X-Forwarded-For): Caddy only, by
      # its service name on the `proxy` network, resolved every 30 s (like
      # WEB_TRUSTED_PROXIES). The adapter forwards that IP to the API, whose
      # per-IP limits on the OAuth routes then apply to the real client.
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-caddy}
    networks:
      # `default` to reach api:4000; `proxy` for Caddy (finances-mcp:4100).
      default: {}
      proxy:
        aliases:
          - finances-mcp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # A TCP connect: no request, so no log line and no rate-limit bucket.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(4100,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

networks:
  # Shared with the server's Caddy; created by the infra bootstrap.
  proxy:
    external: true

volumes:
  db_data:
