# Container scan (#101, SECURITY.md): builds the API and web images and scans
# them with Trivy, failing on fixable high/critical vulnerabilities and on
# secrets. Runs when an image definition changes and weekly (base image CVEs
# appear without any change here); release.yml runs the same scan on the
# release images before pushing them.
#
# The app's own node_modules are skipped: they come from the lockfile, which
# the Security workflow's `pnpm audit` gate covers (allow-list + fix issues).
# Trivy covers the rest of the image: Alpine packages, Node itself, secrets.
name: Container scan

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - '.dockerignore'
      - '.trivyignore'
      - '.github/workflows/container-scan.yml'
  pull_request:
    paths:
      - 'apps/*/Dockerfile'
      - '.dockerignore'
      - '.trivyignore'
      - '.github/workflows/container-scan.yml'
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

concurrency:
  group: container-scan-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Trivy (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Exported as a tarball: Trivy reads it without access to the Docker socket.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=finances-${{ matrix.app }}

      - name: Trivy
        env:
          IMAGE_DIR: ${{ runner.temp }}
        run: |
          docker run --rm -v "$IMAGE_DIR:/scan:ro" -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
            image --input /scan/image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs app/node_modules --skip-dirs app/server/node_modules --no-progress
