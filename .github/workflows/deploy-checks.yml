# Checks for the deploy tooling: shellcheck, the deploy.sh and preview.sh tests
# (fake docker, no server) and actionlint on the workflows. Only runs when they change.
name: Deploy checks

on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/**', 'docker-compose.preview.yml']
  pull_request:
    paths: ['deploy/**', '.github/workflows/**', 'docker-compose.preview.yml']

permissions:
  contents: read

jobs:
  checks:
    name: shellcheck · deploy.sh tests · actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck deploy/*.sh

      - name: Test deploy.sh
        run: bash deploy/test-deploy.sh

      - name: Test preview.sh
        run: bash deploy/test-preview.sh

      - name: Test the preview settings panel
        run: node --test deploy/preview-panel/server.test.mjs

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
