name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push to a PR branch cancels the run in progress for it. Every push to
# main gets its own group (keyed by the commit) so that merges in a row are each
# tested in full: a shared group would cancel the older running or pending run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# Read-only token: CI only checks out and runs the build (#101).
permissions:
  contents: read

env:
  # Local Turborepo cache directory (restored/saved via actions/cache below).
  TURBO_CACHE_DIR: .turbo
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: lint · types · test · build
    runs-on: ubuntu-latest

    # Postgres for integration/DB-backed tests. Uses the same credentials and
    # database name as docker-compose.yml / apps/api/.env.example so specs and
    # migrations run against a familiar connection string.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d finances"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://user:password@localhost:5432/finances

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore the Turbo cache so unchanged tasks are replayed instead of rerun.
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # drizzle.config.ts calls process.loadEnvFile(), which throws if apps/api/.env
      # is missing. Write a minimal file pointing at the Postgres service container.
      - name: Write API .env for migrations
        run: echo "DATABASE_URL=${DATABASE_URL}" > apps/api/.env

      - name: Apply database migrations
        run: pnpm --filter @capi/api db:migrate

      # Turbo reads the cache location from the TURBO_CACHE_DIR env var set above.
      # Don't pass --cache-dir here: `pnpm <script> -- …` forwards the flag past
      # turbo to the underlying tool (eslint/tsc/vitest), which rejects it.
      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
