# Security checks (#101, SECURITY.md), in parallel with CI and with each other:
# - dependency audit: `pnpm audit --prod`, fails on high/critical advisories
#   that are not in .github/security/audit-allowlist.json;
# - SAST: Semgrep with the TypeScript, Node.js and React rule packs;
# - secrets: gitleaks on the commits of the PR (the full history otherwise).
# Also called by release.yml, and run weekly so that new advisories on an
# unchanged main are noticed.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `pnpm audit` only reads the lockfile: no install needed.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: pnpm audit --prod (high/critical, allow-list)
        run: node scripts/audit-prod.mjs

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Community rules only, no Semgrep account or token; --metrics=off sends
      # no usage data. Any finding fails the job (--error). p/default (the
      # registry's baseline: JS/TS, Dockerfile, workflow and package manager
      # rules) is added because the three language packs alone do not flag
      # e.g. eval() of request input. The pnpm rules need a newer pnpm (#156).
      - name: semgrep scan
        run: >-
          semgrep scan --error --metrics=off --disable-version-check
          --config p/default --config p/typescript --config p/nodejs --config p/react
          --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy

  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR: only its commits. Anything else (push to main, release, weekly):
      # the whole history, which takes seconds. --redact keeps secrets out of
      # the log; --verbose shows the rule, file, line and commit of a finding.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n $BASE_SHA ]]; then range="$BASE_SHA..$HEAD_SHA"; else range=HEAD; fi
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --redact --verbose --no-banner --exit-code 1 --log-opts="$range"
