# Staging (#421, runbook: docs/runbooks/staging.md): an override of
# docker-compose.prod.yml for the `capi-staging` project (`finances-staging`
# before #464's step B), deployed from every merge to main by
# .github/workflows/staging.yml and deploy/deploy.sh --staging, in
# /srv/capi-staging with its own `.env` (template: .env.staging.example).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml ...
#
# Same images as production (CAPI_VERSION=sha-<commit>), own database
# volume (DB_VOLUME=finances-staging_db_data, its name before step B), own secrets and host name, no published
# port. It only ever holds the demo data: each deploy wipes the database and
# seeds it again (seed-demo.js --reset). What must never differ from that is
# fixed here rather than in `.env`: the database name, the switches below,
# web's `APP_ENVIRONMENT` (#454) and its alias on the `proxy` network.
name: capi-staging

services:
  db:
    environment:
      POSTGRES_DB: finances_staging

  api:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/finances_staging
      # The one database the demo seed may wipe with NODE_ENV=production
      # (demo/guard.ts); it still refuses `finances`.
      DEMO_STAGING_DATABASE: finances_staging
      # No email, no remote MCP, no call to price or chain APIs: the demo's
      # crypto prices are seeded manual prices.
      SMTP_HOST: ''
      REMOTE_MCP_ENABLED: 'false'
      PRICE_API_ENABLED: 'false'
      WALLET_SYNC_ENABLED: 'false'

  web:
    environment:
      # Yellow header, icons and manifest (#454, apps/web/src/lib/app-environment.tsx):
      # the same image as production, told apart by this variable only.
      APP_ENVIRONMENT: staging
    networks:
      default: {}
      proxy:
        # Replaces production's `capi-web` and `finances-web` (a plain list
        # would be merged with them, and Caddy would send production traffic
        # here too). Caddy (infra repo) targets capi-staging-web:3000;
        # finances-staging-web serves older releases until #464's cleanup.
        aliases: !override
          - capi-staging-web
          - finances-staging-web
